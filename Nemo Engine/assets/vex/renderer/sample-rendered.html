<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vex commentary sample</title><body style="margin:0;background:#100d17;color:#ece6f5;font-family:Georgia,serif;padding:24px;"><main class="mes_text" style="max-width:740px;margin:auto;"><form class="nemo-vn" autocomplete="off" aria-label="Vex commentary"><style>.nemo-vn{display:block;box-sizing:border-box;max-width:100%;margin:1.4rem 0;padding:0;overflow:visible;border:0;border-radius:0;background:transparent;color:#f4edf9;box-shadow:none;font-family:inherit;text-align:left;color-scheme:dark;isolation:isolate;} .nemo-vn *{box-sizing:border-box;} .nemo-vn-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;color:#c8b1e6;font:600 .68rem/1.4 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;} .nemo-vn-heading span:last-child{font-weight:400;letter-spacing:.04em;text-transform:none;color:#b3a5c5;} .nemo-vn-slide{display:block;position:relative;min-width:0;padding-top:260px;} .nemo-vn-window{display:flex;position:relative;z-index:0;isolation:isolate;flex-direction:column;min-width:0;min-height:240px;overflow:visible;border:0;border-radius:16px;background:transparent;color:#f4edf9;} .nemo-vn-window::before{content:"";display:block;position:absolute;z-index:0;inset:0;border:1px solid #ad8bd2;border-radius:16px;background:linear-gradient(145deg,rgba(35,25,49,.98),rgba(20,17,29,.98));box-shadow:0 10px 30px #0005,inset 0 1px 0 #e7d0ff18;pointer-events:none;} .nemo-vn-card{display:block;position:relative;min-width:0;max-width:100%;margin:18px 0;padding:0;border:0;background:transparent;color:#f4edf9;overflow-wrap:anywhere;text-align:left;} .nemo-vn .nemo-vn-card{display:contents;} .nemo-vn-portrait{display:flex;position:relative;z-index:0;align-items:flex-end;justify-content:center;width:100%;min-width:0;margin:0 auto -220px;padding:0;border:0;background:transparent;pointer-events:none;} .nemo-vn-portrait img{display:block;width:auto;max-width:100%;height:auto;max-height:510px;object-fit:contain;object-position:center bottom;margin:0;filter:drop-shadow(0 8px 15px #0004);} .nemo-vn .nemo-vn-portrait{position:absolute;z-index:-1;top:-260px;left:0;width:100%;height:500px;margin:0;padding:0;} .nemo-vn .nemo-vn-portrait img{width:auto!important;max-width:100%!important;height:500px!important;max-height:none;} .nemo-vn-speech{display:block;position:relative;z-index:1;min-width:0;margin:0;padding:22px 24px;border:1px solid #ad8bd2;border-radius:15px;background:rgba(28,21,39,.98);} .nemo-vn .nemo-vn-speech{flex:1 1 auto;padding:34px 26px 13px;border:0;border-radius:0;background:transparent;} .nemo-vn-name{display:block;width:fit-content;max-width:calc(100% - 36px);margin:0 0 13px;font-family:inherit;font-weight:700;font-size:1rem;line-height:1.35;color:#e5ccff;letter-spacing:.01em;overflow-wrap:anywhere;} .nemo-vn .nemo-vn-name{position:absolute;z-index:2;top:-20px;left:20px;margin:0;padding:8px 18px;border:1px solid #bb96df;border-radius:9px;background:linear-gradient(135deg,#493259,#2a2038);box-shadow:0 4px 12px #0004;font-size:.94rem;} .nemo-vn-dialogue{display:block;margin:0;white-space:pre-wrap;font-family:inherit;font-size:1rem;line-height:1.65;color:#f4edf9;overflow-wrap:anywhere;} .nemo-vn-nav{display:none;position:relative;z-index:1;align-items:center;justify-content:space-between;flex:0 0 auto;gap:10px;min-height:66px;margin:0;padding:9px 20px 14px;} .nemo-vn-control{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:90px;min-height:42px;margin:0;padding:9px 13px;border:1px solid #b394d077;border-radius:9px;background:#352543;color:#f7f1ff;font:600 .8rem/1.25 system-ui,sans-serif;cursor:pointer;user-select:none;} .nemo-vn-control:hover{background:#493259;border-color:#d4b4f3;} .nemo-vn-control:focus-within{outline:2px solid #dfc6ff;outline-offset:3px;} .nemo-vn-control input{position:absolute;inset:0;display:block;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;} .nemo-vn-counter{color:#b5a4c6;font:500 .73rem/1.4 system-ui,sans-serif;letter-spacing:.12em;white-space:nowrap;} .nemo-vn-edge{display:inline-flex;align-items:center;justify-content:center;min-width:90px;min-height:42px;color:#90829f;font:500 .75rem/1.3 system-ui,sans-serif;} .nemo-vn-text-only .nemo-vn-speech{padding:22px 24px;} .nemo-vn-legacy{display:block;margin:12px 0;padding:12px 16px;border-left:3px solid #ac83d7;border-radius:8px;background:#241b2d;color:#e8dcef;font:inherit;line-height:1.55;overflow-wrap:anywhere;} @supports selector(:has(input:checked)){ .nemo-vn .nemo-vn-slide{display:none;} .nemo-vn:not(:has(input:checked)) .nemo-vn-slide-1,.nemo-vn:has(.nemo-vn-to-1:checked) .nemo-vn-slide-1,.nemo-vn:has(.nemo-vn-to-2:checked) .nemo-vn-slide-2,.nemo-vn:has(.nemo-vn-to-3:checked) .nemo-vn-slide-3,.nemo-vn:has(.nemo-vn-to-4:checked) .nemo-vn-slide-4{display:block;} .nemo-vn .nemo-vn-nav{display:flex;} .nemo-vn-portrait:not(:has(img)){display:none;} .nemo-vn-slide:not(:has(.nemo-vn-portrait img)){padding-top:22px;} .nemo-vn-slide:not(:has(.nemo-vn-portrait img)) .nemo-vn-window{min-height:0;} .nemo-vn-card:not(:has(.nemo-vn-portrait img)) .nemo-vn-speech{min-height:0;} } @media(max-width:520px){ .nemo-vn{margin:1rem 0;} .nemo-vn-slide{padding-top:220px;} .nemo-vn-window{min-height:210px;border-radius:13px;} .nemo-vn-window::before{border-radius:13px;} .nemo-vn .nemo-vn-portrait{top:-220px;height:430px;} .nemo-vn .nemo-vn-portrait img{height:430px!important;} .nemo-vn .nemo-vn-speech{padding:32px 17px 9px;} .nemo-vn .nemo-vn-name{top:-19px;left:13px;padding:8px 13px;max-width:calc(100% - 26px);font-size:.84rem;} .nemo-vn-dialogue{font-size:.92rem;line-height:1.58;} .nemo-vn-nav{padding:8px 12px 12px;gap:7px;min-height:62px;} .nemo-vn-control,.nemo-vn-edge{min-width:78px;min-height:42px;font-size:.72rem;padding:9px 10px;} .nemo-vn-heading{padding:11px 13px;font-size:.62rem;gap:8px;} .nemo-vn-heading span:last-child{font-size:.62rem;} } @media(prefers-reduced-motion:no-preference){.nemo-vn-control{transition:background .15s ease,border-color .15s ease;}}</style><div class="nemo-vn-slide nemo-vn-slide-1"><div class="nemo-vn-window"><div class="nemo-vn-card" style="max-width:100%;"><figure class="nemo-vn-portrait"><img src="https://raw.githubusercontent.com/NemoVonNirgend/NemoEngine/main/Nemo%20Engine/assets/vex/whimsical/thoughtful.png" alt="Whimsical Vex" loading="lazy" decoding="async" style="display:block;width:100%;max-width:340px;height:auto;object-fit:contain;"></figure><div class="nemo-vn-speech" style="min-width:0;"><strong class="nemo-vn-name">Whimsical Vex</strong><div class="nemo-vn-dialogue" style="white-space:pre-wrap;overflow-wrap:anywhere;">A paper butterfly on the windowsill. Such a small thing to leave behind.</div></div></div><div class="nemo-vn-nav"><span class="nemo-vn-edge" aria-hidden="true">Beginning</span><span class="nemo-vn-counter">01 / 03</span><label class="nemo-vn-control"><input type="radio" name="nemo-vn-page" class="nemo-vn-to-2" aria-label="Next message, 2 of 3"><span aria-hidden="true">Next ▶</span></label></div></div></div><div class="nemo-vn-slide nemo-vn-slide-2"><div class="nemo-vn-window"><div class="nemo-vn-card" style="max-width:100%;"><figure class="nemo-vn-portrait"><img src="https://raw.githubusercontent.com/NemoVonNirgend/NemoEngine/main/Nemo%20Engine/assets/vex/whimsical/amused.png" alt="Whimsical Vex" loading="lazy" decoding="async" style="display:block;width:100%;max-width:340px;height:auto;object-fit:contain;"></figure><div class="nemo-vn-speech" style="min-width:0;"><strong class="nemo-vn-name">Whimsical Vex</strong><div class="nemo-vn-dialogue" style="white-space:pre-wrap;overflow-wrap:anywhere;">And yet everyone in this room has carefully avoided looking at it.</div></div></div><div class="nemo-vn-nav"><label class="nemo-vn-control"><input type="radio" name="nemo-vn-page" class="nemo-vn-to-1" aria-label="Back message, 1 of 3"><span aria-hidden="true">◀ Back</span></label><span class="nemo-vn-counter">02 / 03</span><label class="nemo-vn-control"><input type="radio" name="nemo-vn-page" class="nemo-vn-to-3" aria-label="Next message, 3 of 3"><span aria-hidden="true">Next ▶</span></label></div></div></div><div class="nemo-vn-slide nemo-vn-slide-3"><div class="nemo-vn-window"><div class="nemo-vn-card" style="max-width:100%;"><figure class="nemo-vn-portrait"><img src="https://raw.githubusercontent.com/NemoVonNirgend/NemoEngine/main/Nemo%20Engine/assets/vex/whimsical/delighted.png" alt="Whimsical Vex" loading="lazy" decoding="async" style="display:block;width:100%;max-width:340px;height:auto;object-fit:contain;"></figure><div class="nemo-vn-speech" style="min-width:0;"><strong class="nemo-vn-name">Whimsical Vex</strong><div class="nemo-vn-dialogue" style="white-space:pre-wrap;overflow-wrap:anywhere;">I think we should let that silence do a little more work.</div></div></div><div class="nemo-vn-nav"><label class="nemo-vn-control"><input type="radio" name="nemo-vn-page" class="nemo-vn-to-2" aria-label="Back message, 2 of 3"><span aria-hidden="true">◀ Back</span></label><span class="nemo-vn-counter">03 / 03</span><span class="nemo-vn-edge">End</span></div></div></div></form></main></body></html>
