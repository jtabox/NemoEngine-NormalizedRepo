name: Assemble Nemo Engine 11.5.2
on:
  push:
    paths:
      - '.github/workflows/assemble-nemo-1152.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build targeted preset
        shell: bash
        run: |
          cat > /tmp/patcher.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/patcher.b64 | gzip -d > /tmp/patch1152.py
          python /tmp/patch1152.py \
            "Nemo Engine/Nemo Engine 11.5.1 - General RP.json" \
            "Nemo Engine/Nemo Engine 11.5.2 - General RP.json"
          python - <<'PY'
          import json
          p='Nemo Engine/Nemo Engine 11.5.2 - General RP.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['preset_name']=='Nemo Engine v11.5.2'
          assert d['assistant_prefill']
          r=d['extensions']['regex_scripts']
          assert any(x.get('id')=='0d9a1a96-9009-5af5-bfb7-7a4b8ec8bea4' for x in r)
          P={x['identifier']:x for x in d['prompts']}
          assert P['nemo-user-role-character']['enabled'] is True
          assert P['nemo-pad-loader-resolver']['enabled'] is True
          print('11.5.2 validation passed')
          PY
      - name: Commit preset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Nemo Engine/Nemo Engine 11.5.2 - General RP.json"
          git rm -r .nemo-upload || true
          git commit -m "Add Nemo Engine 11.5.2 targeted fixes"
          git push
