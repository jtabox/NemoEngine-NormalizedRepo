name: Assemble Nemo Engine 11.5.2 Default RP
on:
  push:
    paths:
      - '.github/workflows/assemble-default-rp-1152.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Default RP preset
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path('Nemo Engine/Nemo Engine 11.5.2 - General RP.json')
          dst = Path('Nemo Engine/Nemo Engine 11.5.2 - Default RP.json')
          data = json.loads(src.read_text(encoding='utf-8'))

          # Mirror the latest archived full default (v11.3) where prompt identifiers still exist.
          common = {
              '1770095491833-adrmydb8': False,  # Main Plan
              'cot_step_nsfwfocus': False,
              'cot_step_subtext': False,
              'v11-108-perspective-first-person': True,
              'v11-111-perspective-third-person-omniscient': False,
              'v11-124-pacing-episodic-mode': True,
              'v11-141-format-roleplay-format': True,
              'v11-180-nsfw-nsfw-core': False,
              'v11-187-genre-comedy': True,
              'v11-196-genre-slice-of-life': True,
              'v11-203-influence-masashi-kishimoto': True,
              'v11-300-vex-bubbly-vex': True,
              'v11-305-vex-narrative-vex': False,
          }

          for profile in data.get('prompt_order', []):
              for item in profile.get('order', []):
                  ident = item.get('identifier')
                  if ident in common:
                      item['enabled'] = common[ident]

              # v11.3's second prompt-order profile also shipped with the Scratch Pad enabled.
              if profile.get('character_id') == 100001:
                  for item in profile.get('order', []):
                      if item.get('identifier') == '8f9acca5-6a3b-4a7e-a926-f51682aeb2ee':
                          item['enabled'] = True
                          break

          data['preset_name'] = 'Nemo Engine v11.5.2 - Default RP'
          note = data.get('nemo_merge_note', '')
          data['nemo_merge_note'] = (
              'Default RP variant: uses Nemo Engine v11.5.2 as the engine base and mirrors the '
              'latest archived full preset (v11.3) prompt selections wherever those prompt identifiers still exist. '
              'New v11.5.2-only systems and targeted fixes remain at their shipped defaults.\n\n' + note
          )
          dst.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'NemoVonNirgend'
          git config user.email '207980572+NemoVonNirgend@users.noreply.github.com'
          git add 'Nemo Engine/Nemo Engine 11.5.2 - Default RP.json'
          git commit -m 'Add Nemo Engine 11.5.2 Default RP preset'
          git push
